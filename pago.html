<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D1B2A">
<meta name="robots" content="noindex,nofollow">
<title>Preparando tu material — Mañana Rindo</title>
<style>
:root{--ink:#0D1B2A;--lime:#B9FF66;--paper:#F7F5EF;--muted:#687787;--violet:#6B5CFF;--line:#DBE2E9}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 100% 0%,rgba(185,255,102,.30),transparent 28rem),var(--paper);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
.wrap{max-width:520px;margin:auto;min-height:100vh;padding:24px 18px;display:grid;place-items:center}
.card{width:100%;background:#fff;border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:0 18px 50px #0d1b2a14;text-align:center}
.logo{font-size:24px;font-weight:950;margin-bottom:23px;letter-spacing:-.04em}.logo b{background:var(--lime);padding:2px 7px;border-radius:9px}
.ico{font-size:48px}h1{font-size:28px;line-height:1.08;margin:10px 0}p{font-size:14px;color:var(--muted);line-height:1.55}
.spin{width:36px;height:36px;border-radius:50%;border:4px solid #E7EAF0;border-top-color:var(--violet);animation:s 1s linear infinite;margin:19px auto}
@keyframes s{to{transform:rotate(360deg)}}
.btn{display:none;width:100%;border:0;background:var(--lime);color:var(--ink);padding:15px;border-radius:14px;font-weight:950;font-size:16px;text-decoration:none;margin-top:15px}
.small{font-size:11px;color:#8A95A0;margin-top:13px;line-height:1.45}
</style>
</head>
<body>
<main class="wrap"><section class="card">
<div class="logo">Mañana <b>Rindo</b></div>
<div id="ico" class="ico">⏳</div>
<h1 id="title">Estamos confirmando tu pago</h1>
<p id="msg">Cuando Mercado Pago lo confirme, preparamos exactamente la opción que elegiste.</p>
<div id="spin" class="spin"></div>
<a id="retry" class="btn" href="#">Intentar pagar nuevamente</a>
<div class="small">Tu material se guarda automáticamente cuando termina. Podés volver a abrirlo después.</div>
</section></main>
<script>
const STATUS_URL="https://dailyastroinfo.app.n8n.cloud/webhook/manana-rindo-estado-orden-prod-v1";
const q=new URLSearchParams(location.search);
const orderId=q.get("order_id");
const result=q.get("result")||q.get("status")||"";
const title=document.getElementById("title"),msg=document.getElementById("msg"),ico=document.getElementById("ico"),spin=document.getElementById("spin"),retry=document.getElementById("retry");

if(result==="failure"){
 title.textContent="El pago no se completó";
 msg.textContent="No generamos el material. Podés volver a intentarlo.";
 ico.textContent="❌";spin.style.display="none";
} else if(result==="pending"){
 title.textContent="Tu pago está pendiente";
 msg.textContent="Cuando Mercado Pago lo apruebe, vamos a preparar el material automáticamente.";
 ico.textContent="🕒";
} else if(result==="success"){
 title.textContent="¡Pago realizado!";
 msg.textContent="Ahora estamos preparando tu material personalizado.";
 ico.textContent="✅";
}

let pollAttempt=0;
const SUCCESS_DELAYS=[10000,12000,15000,20000,25000,30000];
const PENDING_DELAYS=[15000,20000,30000,45000,60000];

function nextDelay(){
 const list=result==="pending"?PENDING_DELAYS:SUCCESS_DELAYS;
 return list[Math.min(pollAttempt,list.length-1)];
}
function updateWaitingMessage(){
 if(result==="success"){
  const messages=[
   "Pago confirmado. Estamos leyendo tus apuntes en profundidad.",
   "Estamos armando tu material personalizado.",
   "Estamos revisando ejercicios, explicaciones y respuestas.",
   "Ya falta poco. Estamos guardando tu material."
  ];
  msg.textContent=messages[Math.min(pollAttempt,messages.length-1)];
 }
}
async function poll(){
 if(!orderId)return;
 updateWaitingMessage();
 try{
  const u=new URL(STATUS_URL);u.searchParams.set("order_id",orderId);
  const r=await fetch(u.href,{cache:"no-store"});
  const d=await r.json();
  if(d.status==="ready"&&d.pack_url){
   title.textContent="¡Está listo!";
   msg.textContent="Abriendo tu material…";
   ico.textContent="🎉";spin.style.display="none";
   location.replace(d.pack_url);
   return;
  }
  if(d.checkout_url&&result==="failure"){
   retry.href=d.checkout_url;retry.style.display="block";return;
  }
 }catch(e){}
 pollAttempt++;
 setTimeout(poll,nextDelay());
}
if(orderId&&result!=="failure") setTimeout(poll,nextDelay());
</script>
</body></html>
